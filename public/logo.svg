<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Hexagon -->
  <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="#0f0f13" stroke="url(#neon-grad)" stroke-width="4" />
  <!-- Neon Glow Accent -->
  <polygon points="50,12 83,31 83,69 50,88 17,69 17,31" fill="none" stroke="url(#neon-grad)" stroke-width="1.5" opacity="0.3" filter="url(#glow)" />
  <!-- Centered </A> Code Terminal Prompt -->
  <g transform="translate(5, 5)">
    <!-- &lt; symbol -->
    <path d="M 28,38 L 15,45 L 28,52" fill="none" stroke="url(#neon-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Stylized A slash -->
    <path d="M 37,58 L 47,32 L 53,32 L 63,58" fill="none" stroke="url(#neon-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 41,49 L 59,49" fill="none" stroke="url(#neon-grad)" stroke-width="4" stroke-linecap="round" />
    <!-- &gt; symbol -->
    <path d="M 62,38 L 75,45 L 62,52" fill="none" stroke="url(#neon-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
